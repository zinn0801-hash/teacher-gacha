<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先生ガチャ｜先生用設定</title><style>body{font-family:system-ui,'Yu Gothic',sans-serif;background:#101528;color:white;margin:0;padding:24px}main{max-width:700px;margin:auto}.panel{background:#1b2340;padding:20px;border-radius:16px;margin:18px 0}label{display:block;margin:10px 0;font-weight:bold}input{font:inherit;width:100%;padding:10px;border-radius:8px;box-sizing:border-box;background:#101528;color:white;border:1px solid #8c9cc4}button{font:inherit;padding:13px;border-radius:9px;background:#6855cf;color:white;border:0;cursor:pointer;margin:8px 0}button:disabled{opacity:.4}a{color:#b9b2ff;overflow-wrap:anywhere}small{color:#c2cbe0}#url{overflow-wrap:anywhere;word-break:break-all}#msg{color:#ffcf7d}</style></head><body><main><h1>⚙ 先生ガチャ・先生用設定</h1><p>5種類の割合を決めて「生徒用URLを作成」を押してください。URLをTeamsで配布すると全員同じ排出率でガチャを引けます。</p><section class="panel"><div id="fields"></div><p id="sum"></p><button id="make">生徒用URLを作成</button><p id="msg" role="alert"></p></section><section class="panel" id="result" hidden><h2>生徒用URL</h2><p id="url"></p><button id="copy">URLをコピー</button> <a id="open" target="_blank" rel="noopener">生徒用画面を開く</a><p><small>設定を変えた場合は、新しいURLを作成して再配布してください。以前のURLの設定は変わりません。</small></p></section><p><small>注意：これはURLに設定を埋め込む方式です。生徒の画面に設定ボタンは出ませんが、URLの解析によって割合が分かる可能性があります。厳密に秘密にするにはサーバーが必要です。</small></p></main><script>(()=>{const names=['N','R','SR','SSR','UR'],initial=[60,25,10,4,1];const fields=document.getElementById('fields');names.forEach((n,i)=>{const label=document.createElement('label');label.textContent=n+'（％）';const inp=document.createElement('input');inp.type='number';inp.min=0;inp.max=100;inp.step=.000001;inp.value=initial[i];label.appendChild(inp);fields.appendChild(label)});const inputs=[...fields.querySelectorAll('input')];function validate(){const nums=inputs.map(x=>Number(x.value));const valid=inputs.every(x=>x.value.trim()!==''&&Number.isFinite(Number(x.value))&&Number(x.value)>=0&&Number(x.value)<=100&&Math.abs(Number(x.value)*1000000-Math.round(Number(x.value)*1000000))<.00001);const sum=nums.reduce((a,b)=>a+b,0);document.getElementById('sum').textContent='合計：'+sum.toFixed(6)+'％';return valid&&Math.abs(sum-100)<.0000001?nums:null}inputs.forEach(i=>i.addEventListener('input',validate));validate();let link='';document.getElementById('make').addEventListener('click',()=>{const vals=validate();if(!vals){document.getElementById('msg').textContent='0～100の数値で合計100％にしてください（小数6桁まで）。';return}document.getElementById('msg').textContent='';const counts=vals.map(x=>Math.round(x*1000000));const u=new URL('./index.html',location.href);u.searchParams.set('p',counts.join(','));link=u.href;document.getElementById('url').textContent=link;document.getElementById('open').href=link;document.getElementById('result').hidden=false});document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(link);document.getElementById('msg').textContent='URLをコピーしました。'}catch(e){document.getElementById('msg').textContent='コピーできない場合は上のURLを選択してコピーしてください。'}})})();</script></body></html>
