<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>先生ガチャ｜標本調査</title><style>
:root{font-family:'Yu Gothic',Meiryo,system-ui,sans-serif;color:#f5f6ff;background:#101528}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:22px 15px 55px}h1{font-size:clamp(27px,5vw,45px);margin:8px 0}p{line-height:1.6}.sub{color:#b6bfd8}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.panel{background:#1b2340;border:1px solid #354064;border-radius:18px;padding:18px;margin:18px 0}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{cursor:pointer;border:1px solid #5c6d9a;background:#29395e;color:white;border-radius:12px;padding:13px;font-size:17px;font-weight:700}button:hover{background:#39517e}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#6352c7;border-color:#9586ed}.hidden{display:none!important}.settings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}label{font-weight:700}input{width:100%;padding:10px;border-radius:8px;border:1px solid #7181aa;background:#10192f;color:white;font-size:17px;margin-top:6px}.muted{color:#aeb9d3;font-size:14px}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.card{min-width:0;animation:pop .3s both}.card img{display:block;width:100%;height:auto;border-radius:9px}.card small{display:block;text-align:center;color:#c9d1e5}.cards .card:nth-child(10n+2){animation-delay:.04s}.cards .card:nth-child(10n+3){animation-delay:.08s}.cards .card:nth-child(10n+4){animation-delay:.12s}.cards .card:nth-child(10n+5){animation-delay:.16s}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.stat{background:#121b34;padding:12px 5px;text-align:center;border-radius:10px}.stat strong{display:block;font-size:24px}.barrow{display:grid;grid-template-columns:45px 1fr 80px;align-items:center;gap:10px;margin:12px 0}.track{background:#11192d;height:19px;border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}.notice{background:#263253;border-radius:10px;padding:12px}.result-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}@media(max-width:600px){.settings{grid-template-columns:repeat(3,minmax(0,1fr))}.cards{gap:4px}.card img{border-radius:4px}.stats{gap:3px}.stat{padding:8px 2px}.stat strong{font-size:18px}.stat span{font-size:12px}button{font-size:15px;padding:12px 7px}}@media(prefers-reduced-motion:reduce){.card{animation:none}}
</style></head><body><main><div class="head"><div><div class="sub">中学3年 数学｜標本調査</div><h1>🎰 先生ガチャ</h1><div class="sub">母集団：1億個のガチャから無作為に取り出そう！</div></div><span class="sub">生徒用</span></div>
<section class="panel"><h2>何回ガチャを回す？</h2><div class="buttons"><button class="primary draw" data-count="10">10連</button><button class="primary draw" data-count="100">100連</button><button class="primary draw" data-count="1000">1000連</button></div><p class="muted">取り出したガチャは戻さない「非復元抽出」です。毎回、新しく1億個から抽出します。</p></section>
<section id="welcome" class="panel" style="text-align:center"><div style="font-size:58px">🎁</div><h2>ガチャを回してみよう！</h2><p class="sub">どの先生が何枚出るかな？</p></section>
<section id="results" class="hidden"><div class="panel"><div class="result-head"><h2 id="resultTitle">ガチャ結果</h2><button id="toggleStats">📊 集計結果を隠す</button></div><p class="muted">引いたキャラクターを一覧表示。10連は全10枚、100連・1000連は100枚ずつ表示します。</p><div class="pager"><button id="prev">◀ 前の100枚</button><span id="pageInfo"></span><button id="next">次の100枚 ▶</button></div><div id="cards" class="cards"></div><div class="pager"><button id="prev2">◀ 前へ</button><span id="pageInfo2"></span><button id="next2">次へ ▶</button></div></div><div class="panel" id="summary"><h2>📊 自動集計結果</h2><div class="stats" id="stats"></div><h3>標本の中での割合</h3><div id="bars"></div><p class="notice">考えてみよう：標本の大きさを変えると、母集団の割合の推定はどう変わるだろう？</p></div></section>
</main><script>
(()=>{'use strict';const names=['N','R','SR','SSR','UR'],colors=['#a6b3c7','#4ab5e9','#edbd4b','#be73ed','#f0c34f'];let rates=[60,25,10,4,1],drawn=[],page=0;const $=id=>document.getElementById(id);
// URL内の母集団個数を検証。URLがなければ既定値を使う。
const encoded=new URLSearchParams(location.search).get('p');
if(encoded){const pieces=encoded.split(',');if(pieces.length===5&&pieces.every(x=>/^\d+$/.test(x))){const nums=pieces.map(Number);if(nums.every(Number.isSafeInteger)&&nums.reduce((a,b)=>a+b,0)===100000000){rates=nums.map(x=>x/1000000)}}}
function renderPage(){const el=$('cards');el.replaceChildren();const max=Math.ceil(drawn.length/100);$('pageInfo').textContent=$('pageInfo2').textContent=`${page+1} / ${max} ページ`;for(const id of ['prev','prev2'])$(id).disabled=page===0;for(const id of ['next','next2'])$(id).disabled=page===max-1;drawn.slice(page*100,(page+1)*100).forEach((v,i)=>{const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.src='assets/'+names[v]+'.png';img.alt=names[v]+'の先生カード';img.loading=i<15?'eager':'lazy';card.appendChild(img);el.appendChild(card)})}function renderStats(){const n=drawn.length,counts=names.map((_,i)=>drawn.filter(v=>v===i).length);$('stats').replaceChildren();$('bars').replaceChildren();names.forEach((name,i)=>{const percent=counts[i]/n*100;const stat=document.createElement('div');stat.className='stat';stat.innerHTML=`<span style="color:${colors[i]}">${name}</span><strong>${counts[i].toLocaleString()}枚</strong><span>${percent.toFixed(1)}％</span>`;$('stats').appendChild(stat);const row=document.createElement('div');row.className='barrow';row.innerHTML=`<b>${name}</b><div class="track"><div class="fill" style="background:${colors[i]};width:${percent}%"></div></div><span style="text-align:right">${percent.toFixed(1)}％</span>`;$('bars').appendChild(row)})}function draw(n){const remaining=rates.map(v=>Math.round(v*1000000));let left=100000000;drawn=[];for(let i=0;i<n;i++){let r=Math.floor(Math.random()*left);for(let j=0;j<5;j++){if(r<remaining[j]){drawn.push(j);remaining[j]--;break}r-=remaining[j]}left--}page=0;$('welcome').classList.add('hidden');$('results').classList.remove('hidden');$('summary').classList.remove('hidden');$('toggleStats').textContent='📊 集計結果を隠す';$('resultTitle').textContent=n.toLocaleString()+'連ガチャ結果';renderPage();renderStats()}document.querySelectorAll('.draw').forEach(b=>b.addEventListener('click',()=>draw(Number(b.dataset.count))));for(const id of ['prev','prev2'])$(id).addEventListener('click',()=>{if(page>0){page--;renderPage()}});for(const id of ['next','next2'])$(id).addEventListener('click',()=>{if((page+1)*100<drawn.length){page++;renderPage()}});$('toggleStats').addEventListener('click',()=>{const hidden=$('summary').classList.toggle('hidden');$('toggleStats').textContent=hidden?'📊 集計結果を表示':'📊 集計結果を隠す'})})();
</script></body></html>
